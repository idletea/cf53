name: Build & Publish
on:
  push:
  workflow_dispatch:
    inputs:
      publish_the_build:
        description: Publish the build
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: jdx/mise-action@v4

    - name: Install
      run: just install

    - name: Check
      run: just check

    - name: Test
      run: just test

    - name: Build
      run: just build

    - name: Store
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_the_build == true)
    needs: ["build"]

    runs-on: ubuntu-latest

    environment:
      name: publish
      url: https://pypi.org/p/cf53

    permissions:
      id-token: write

    steps:
    - name: Download
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
