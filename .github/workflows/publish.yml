name: Build & Publish
on: push

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: jdx/mise-action@v4

    - name: Install
      run: uv sync --frozen

    - name: Check
      run: just check

    - name: Test
      run: just test

    - name: Build
      run: uv build

    - name: Store
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: ["build"]

    runs-on: ubuntu-latest

    environment:
      name: publish
      url: https://pypi.org/p/cf53

    permissions:
      id-token: write

    steps:
    - name: Download
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
